[package]
name = "peripheral-ui"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Peripheral script and device management"

[workspace]

[dependencies]
anyhow = "1"
async-channel = "2"
gpui-kit = "=0.9.0"
gpui-core = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
gpui-windows = { package = "gpui-pre-windows", version = "=0.3.11", features = ["test-support"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
peripheral-ui-protocol = { path = "../crates/ui-protocol" }
peripheral-repl = { path = ".." }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_Accessibility", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_RestartManager", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
lto = "thin"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
