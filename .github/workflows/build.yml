name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        shell: pwsh
        run: rustup update stable
      - name: Offline runtime regression tests
        shell: pwsh
        run: |
          cargo test --locked --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path crates/ui-protocol/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline UI layout tests
        shell: pwsh
        run: cargo test --locked --manifest-path ui/Cargo.toml --bin peripheral-ui
      - name: Build application and native adapter
        shell: pwsh
        run: ./build.ps1 -Release
      - name: Package
        shell: pwsh
        run: ./package.ps1 -Destination "$env:RUNNER_TEMP/Peripheral-windows-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: Peripheral-windows-x64
          path: |
            ${{ runner.temp }}/Peripheral-windows-x64.zip
            ${{ runner.temp }}/Peripheral-windows-x64.zip.sha256
